# Stellar Apex — PROD backend stack on THIS machine.
#   apex_db_prod  : MySQL 8  (own volume; reference data + admins on first boot)
#   apex_php_prod : PHP 8.2 + Apache serving api/, seeded with 1 Noble sample
#
# Run:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# This stack alone is only reachable on localhost:8090. For the Hostinger frontend
# to reach it, the API must be exposed publicly over HTTPS (a Cloudflare tunnel or
# similar) — added separately once you approve that exposure.

services:
  apex_db_prod:
    image: mysql:8.0
    container_name: apex_db_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stellar_apex}
      MYSQL_USER: ${MYSQL_USER:-apex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env.prod}
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - apex_db_prod_data:/var/lib/mysql
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  apex_php_prod:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: apex_php_prod
    restart: unless-stopped
    depends_on:
      apex_db_prod:
        condition: service_healthy
    environment:
      DB_HOST: apex_db_prod
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-stellar_apex}
      DB_USER: ${MYSQL_USER:-apex}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod}
      JWT_TTL: ${JWT_TTL:-28800}
      ENC_KEY: ${ENC_KEY:?set in .env.prod}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SEED_MODE: ${SEED_MODE:-sample}
      UPLOADS_DIR: /var/uploads
    ports:
      - "${PHP_HOST_PORT:-8090}:80"
    volumes:
      - ./api:/var/www/html/api:ro
      - apex_uploads_prod:/var/uploads

volumes:
  apex_db_prod_data:
  apex_uploads_prod:
