# Stellar Apex — LOCAL DEV backend (mirrors Hostinger's PHP + MySQL).
#   apex_db  : MySQL 8   (schema + reference data + admin users auto-loaded on first boot)
#   apex_php : PHP 8.2 + Apache serving api/ (same code that deploys to Hostinger)
#
# The Vite dev server proxies /api → apex_php (see vite.config.js), so the browser
# only ever talks to its own origin — same-origin, exactly like production.
#
#   docker compose up -d --build
#   Frontend: npm run dev  (http://localhost:5173, proxies /api to :8080)

services:
  apex_db:
    image: mysql:8.0
    container_name: apex_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stellar_apex}
      MYSQL_USER: ${MYSQL_USER:-apex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apexpass}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - apex_db_data:/var/lib/mysql
      - ./api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  apex_php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: apex_php
    restart: unless-stopped
    depends_on:
      apex_db:
        condition: service_healthy
    environment:
      DB_HOST: apex_db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-stellar_apex}
      DB_USER: ${MYSQL_USER:-apex}
      DB_PASSWORD: ${MYSQL_PASSWORD:-apexpass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-jwt-secret}
      JWT_TTL: ${JWT_TTL:-28800}
      ENC_KEY: ${ENC_KEY:-0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0}
    ports:
      - "${PHP_HOST_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html/api

volumes:
  apex_db_data:
